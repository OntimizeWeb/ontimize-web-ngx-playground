<mat-card class="inputs-mat-card">
  <div class="o-layout-align-center-center img-container" layout-margin>
    @if (!dark) {
      <mat-icon svgIcon="ontimize:{{compName}}"></mat-icon>
    }
    @if (dark) {
      <mat-icon svgIcon="ontimize:{{compName}}_dark"></mat-icon>
    }
  </div>
  <mat-divider></mat-divider>
  <mat-card-header>
    <mat-card-title>
      {{header}}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>{{content}}</mat-card-content>
</mat-card>
