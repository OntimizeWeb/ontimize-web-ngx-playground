<ng-template #templateref let-cellvalue="cellvalue" let-rowvalue="rowvalue">
  <span *ngIf="cellvalue < 0" style="color:red;" class="o-layout-align-e-center">
    <mat-icon>arrow_drop_down</mat-icon>{{ getCellData(cellvalue) }}</span>
  <span *ngIf="cellvalue >= 0" style="color:green" class="o-layout-align-e-center">
    <mat-icon>arrow_drop_up</mat-icon>{{ getCellData(cellvalue) }}</span>
</ng-template>
