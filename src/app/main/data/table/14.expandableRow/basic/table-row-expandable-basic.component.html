<example-comp #ex collapsible="no" collapsed="no" comp-name="TABLE.EXAMPLE_SIMPLE_TEMPLATE_ROW_EXPANDABLE"
  comp-desc="TABLE.EXAMPLE_SIMPLE_TEMPLATE_ROW_EXPANDABLE_DESC" [files]="getFiles('o-table-row-expandable')">
  <div class="o-flex-row o-layout-align-center-start" layout-padding>
    <o-table class="o-flex-fill" #table service-type="DummyService" service="customers" entity="customer" keys="CUSTOMERID" columns="CUSTOMERID;SURNAME;NAME"
      title="CUSTOMERS" insert-button="no" delete-button="no" refresh-button="no" pagination-controls="yes" detail-mode="none" export-button="no"
      query-rows="10" fixed-header="yes" show-charts-on-demand-option="no">
      <o-table-row-expandable>
        <ng-template let-row>
          <o-column title="CONTACT_DATA" icon="info" class="vertical-margin-10" layout-gap="12px">
            <div class="o-flex-row-wrap" style="gap: 14px">
              <span style="flex: 1 1 30%; max-width: 30%"><strong>{{'ADDRESS' | oTranslate}}</strong>: {{row.ADDRESS}}</span>
              <span style="flex: 1 1 20%; max-width: 20%"><strong>{{'COUNTRY' | oTranslate}}</strong>: {{row.COUNTRY}}</span>
              <span style="flex: 1 1 20%; max-width: 20%"><strong>{{'STATE' | oTranslate}}</strong>: {{row.STATE}}</span>
              <span style="flex: 1 1 20%; max-width: 20%"><strong>{{'ZIPCODE' | oTranslate}}</strong>: {{row.ZIPCODE}}</span>
            </div>
            <div class="o-flex-row-wrap" style="gap: 14px">
              <span style="flex: 1 1 40%; max-width: 40%"><strong>{{'EMAIL' | oTranslate}}</strong>: {{row.EMAIL}}</span>
              <span style="flex: 1 1 40%; max-width: 40%"><strong>{{'PHONE' | oTranslate}}</strong>: {{row.PHONE}}</span>
            </div>
          </o-column>
        </ng-template>
      </o-table-row-expandable>

    </o-table>
  </div>
</example-comp>
