<example-comp #ex collapsible="no" collapsed="no" comp-name="TABLEEXPANDABLE.BUTTON.EXPANDABLEFUNCTIONSYNC_TITLE"
  comp-desc="TABLEEXPANDABLE.BUTTON.EXPANDABLEFUNCTIONSYNC_DESC" [files]="getFiles('o-table-row-expandable-function-sync')">
  <div class="o-flex-row o-layout-align-c-start" layout-padding >
    <o-table class="o-flex-fill" #table service-type="DummyService" service="customers" entity="customer" keys="CUSTOMERID" columns="CUSTOMERID;SURNAME;NAME"
      title="CUSTOMERS" insert-button="no" delete-button="no" refresh-button="no" pagination-controls="yes" detail-mode="none" export-button="no"
      query-rows="10" fixed-header="yes" [show-expandable-icon-function]="hasChilds" show-charts-on-demand-option="no">
      <o-table-row-expandable>
        <ng-template let-row>
          <o-column title="CONTACT_DATA" icon="info" class="vertical-margin-10" layout-gap="12px">
            <div class="o-flex-row-wrap" style="gap:14px">
              <span style="flex:0 0 30%"><strong>{{'ADDRESS' | oTranslate}}</strong>: {{row.ADDRESS}}</span>
              <span style="flex:0 0 20%"><strong>{{'COUNTRY' | oTranslate}}</strong>: {{row.COUNTRY}}</span>
              <span style="flex:0 0 20%"><strong>{{'STATE' | oTranslate}}</strong>: {{row.STATE}}</span>
              <span style="flex:0 0 20%"><strong>{{'ZIPCODE' | oTranslate}}</strong>: {{row.ZIPCODE}}</span>
            </div>
            <div class="o-flex-row-wrap" style="gap:14px">
              <span style="flex:0 0 40%"><strong>{{'EMAIL' | oTranslate}}</strong>: {{row.EMAIL}}</span>
              <span style="flex:0 0 40%"><strong>{{'PHONE' | oTranslate}}</strong>: {{row.PHONE}}</span>
            </div>
          </o-column>
        </ng-template>
      </o-table-row-expandable>
    </o-table>
  </div>
</example-comp>
