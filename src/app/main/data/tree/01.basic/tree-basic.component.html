<example-comp class="o-flex-fill" #ex collapsible="no" collapsed="no" comp-name="TREE.BASIC.COMPONENT" comp-desc="TREE.BASIC.COMPONENT.DESC" [files]="files"
  (showSource)="onShowSource(ex)">
  <div class="o-flex-row o-layout-align-c-stretch" layout-padding>

    <o-tree #treeview class="o-flex" service-type="DummyService" service="customers" entity="customer" keys="CUSTOMERID" select-all-checkbox="yes"
      select-all-checkbox-visible="yes" columns="CUSTOMERID;SURNAME;NAME" visible-columns="SURNAME;NAME" separator=", " recursive="no"
      query-on-init="true" root-title="CUSTOMERS" [title]="treeTitle.value" [controls]="controlsToggle.checked"
      [quick-filter]="quickFilterToggle.checked" [refresh-button]="refreshButtonToggle.checked" (onNodeSelected)="nodeSelected($event)"
      (onNodeExpanded)="nodeExpanded($event)" (onNodeCollapsed)="nodeCollapsed($event)" (onLoadNextLevel)="nextLevelLoaded($event)"
      (onDataLoaded)="onDataLoaded($event)">
    </o-tree>


    <o-column attr="conf" title="{{ 'TREE.CONFIGURATION' | oTranslate }}" elevation="0" style="flex:0 0 45%" layout-padding layout-align="start stretch">

      <o-column title="{{ 'TREE.INPUTS' | oTranslate }}" elevation="0" layout-align="center">
        <mat-form-field style="flex:0 0 50%">
          <input matInput #treeTitle placeholder="{{ 'TITLE' | oTranslate }}" value="Tree">
        </mat-form-field>
        <div class="o-flex-column">
          <mat-slide-toggle #controlsToggle checked="true">
            {{ 'TREE.CONTROLS' | oTranslate }}
          </mat-slide-toggle>

          <mat-slide-toggle #quickFilterToggle checked="true">
            {{ 'TREE.QUICKFILTER' | oTranslate }}
          </mat-slide-toggle>

          <mat-slide-toggle #refreshButtonToggle checked="true">
            {{ 'TREE.REFRESH_BUTTON' | oTranslate }}
          </mat-slide-toggle>
        </div>
      </o-column>
      <o-column class="event-column" title="{{ 'TREE.OUTPUTS' | oTranslate }}" elevation="0" layout-padding layout-align="center">
        @for (ev of treeEvents; track ev) {
          <div>
            {{ ev.event }}
          </div>
        }
      </o-column>
    </o-column>
  </div>
</example-comp>
