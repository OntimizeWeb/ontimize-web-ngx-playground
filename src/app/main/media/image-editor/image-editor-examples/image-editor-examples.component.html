<example-comp comp-name="EXAMPLES" [files]="files">
  <div class="o-flex-row-wrap o-flex-fill o-layout-align-sb-center">
    <o-column class="o-flex-fill" title="IMAGE_EDITOR.O_IMAGE">
      <o-image [data]="img"></o-image>
      <o-image-editor [image]="imageBase64" save-target="base64" (oSaveBase64)="saveBase64($event)" actions-position="bottom"></o-image-editor>
    </o-column>
  </div>
</example-comp>
