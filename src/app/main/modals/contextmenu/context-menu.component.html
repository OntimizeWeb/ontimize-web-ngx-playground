<div class="o-flex-row main-container bg-level-1">
  <div class="o-flex-column o-layout-align-center-start o-flex">

    <example-comp comp-name="CONTEXTMENU" [files]="getFiles()" class="o-flex-fill">

      <div class="o-flex-row o-fill" layout-padding>
        <div [oContextMenu]="myOContextMenu" class="clickable o-layout-align-center-center" layout-padding>
          <span>{{ 'CONTEXT_MENU_CLICKABLE_AREA' | oTranslate }}</span>
        </div>
        <o-context-menu #myOContextMenu>
          <o-context-menu-item icon="face" label="Item 1" (execute)="onExecute('Item 1')" enabled="no"></o-context-menu-item>
          <o-context-menu-group label="Group" icon="priority_high">
            <o-context-menu-item icon="star_rate" label="Item 2" (execute)="onExecute('Item 2')" enabled="no"></o-context-menu-item>
            <o-context-menu-separator></o-context-menu-separator>
            <o-context-menu-item label="Item 3" (execute)="onExecute('Item 3')"></o-context-menu-item>
          </o-context-menu-group>
        </o-context-menu>
      </div>

    </example-comp>

  </div>
</div>
