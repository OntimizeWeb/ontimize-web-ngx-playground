<div class="o-flex-column main-container bg-level-1">
  <div class="o-flex-column o-flex" >

    <example-comp comp-name="BUTTON_LEGACY" comp-desc="BUTTON_LEGACY.DESC" [files]="getFiles('buttons')">

      <div class="o-flex-column" layout-padding>
        <div class="o-flex-row">
          <o-button attr="basic1" type="BASIC" label="BASIC" layout-padding></o-button>
          <o-button attr="basic2" type="BASIC" label="Primary" layout-padding color="primary"></o-button>
          <o-button attr="basic3" type="BASIC" label="Accent" layout-padding color="accent"></o-button>
          <o-button attr="basic4" type="BASIC" label="Warn" layout-padding color="warn"></o-button>
          <o-button attr="basic5" type="BASIC" label="Disabled" layout-padding enabled="no"></o-button>
        </div>

        <div class="o-flex-row">
          <o-button attr="raised1" type="RAISED" label="RAISED" layout-padding></o-button>
          <o-button attr="raised2" type="RAISED" label="Primary" layout-padding color="primary"></o-button>
          <o-button attr="raised3" type="RAISED" label="Accent" layout-padding color="accent"></o-button>
          <o-button attr="raised4" type="RAISED" label="Warn" layout-padding color="warn"></o-button>
          <o-button attr="raised5" type="RAISED" label="Disabled" layout-padding enabled="no"></o-button>
        </div>
        <div class="o-flex-row">
          <o-button attr="stroked1" type="STROKED" label="STROKED" layout-padding></o-button>
          <o-button attr="stroked2" type="STROKED" label="Primary" layout-padding color="primary"></o-button>
          <o-button attr="stroked3" type="STROKED" label="Accent" layout-padding color="accent"></o-button>
          <o-button attr="stroked4" type="STROKED" label="Warn" layout-padding color="warn"></o-button>
          <o-button attr="stroked5" type="STROKED" label="Disabled" layout-padding enabled="no"></o-button>
        </div>

        <div class="o-flex-row">
          <o-button attr="flat1" type="FLAT" label="FLAT" layout-padding></o-button>
          <o-button attr="flat2" type="FLAT" label="Primary" layout-padding color="primary"></o-button>
          <o-button attr="flat3" type="FLAT" label="Accent" layout-padding color="accent"></o-button>
          <o-button attr="flat4" type="FLAT" label="Warn" layout-padding color="warn"></o-button>
          <o-button attr="flat5" type="FLAT" label="Disabled" layout-padding enabled="no"></o-button>
        </div>

        <div class="o-flex-row">
          <o-button attr="icon1" type="ICON" icon="add" layout-padding></o-button>
          <o-button attr="icon2" type="ICON" icon="add" layout-padding color="primary"></o-button>
          <o-button attr="icon3" type="ICON" icon="add" layout-padding color="accent"></o-button>
          <o-button attr="icon4" type="ICON" icon="add" layout-padding color="warn"></o-button>
          <o-button attr="icon5" type="ICON" icon="add" layout-padding enabled="no"></o-button>
        </div>

        <div class="o-flex-row">
          <o-button attr="fab1" type="FAB" icon="power_setting" layout-padding></o-button>
          <o-button attr="fab2" type="FAB" icon="power_setting" layout-padding color="primary"></o-button>
          <o-button attr="fab3" type="FAB" icon="power_setting" layout-padding color="accent"></o-button>
          <o-button attr="fab4" type="FAB" icon="power_setting" layout-padding color="warn"></o-button>
          <o-button attr="fab5" type="FAB" icon="power_setting" layout-padding enabled="no"></o-button>
        </div>

        <div class="o-flex-row">
          <o-button attr="fab-mini1" type="FAB-MINI" icon="power_setting" layout-padding></o-button>
          <o-button attr="fab-mini2" type="FAB-MINI" icon="power_setting" layout-padding color="primary"></o-button>
          <o-button attr="fab-mini3" type="FAB-MINI" icon="power_setting" layout-padding color="accent"></o-button>
          <o-button attr="fab-mini4" type="FAB-MINI" icon="power_setting" layout-padding color="warn"></o-button>
          <o-button attr="fab-mini5" type="FAB-MINI" icon="power_setting" layout-padding enabled="no"></o-button>
        </div>
      </div>

    </example-comp>

    <example-comp comp-name="VARIANT_IMPORTANCE" comp-desc="VARIANT_IMPORTANCE.DESC" [files]="getFiles('button-variant-importance')">
      <div class="o-flex-column variant-importance-example" layout-padding>

        <!-- the example reads as a grid: rows = variant input, columns = importance input -->
        <div class="o-flex-row vi-axis-caption">
          <span class="vi-importance-axis">importance &rarr;</span>
        </div>

        <!-- column legend: each row repeats the same importance values -->
        <div class="o-flex-row vi-variant-row vi-header-row">
          <span class="vi-variant-label vi-row-axis">variant &darr;</span>
          <span class="vi-col-header">Default</span>
          <span class="vi-col-header">Primary</span>
          <span class="vi-col-header">Warn</span>
          <span class="vi-col-header">Disabled</span>
        </div>

        <!-- one row per variant (same order as the legacy type example), columns are the importance values + disabled -->
        <div class="o-flex-row vi-variant-row">
          <span class="vi-variant-label">basic</span>
          <o-button attr="basic-def" variant="basic" importance="default" label="Default" layout-padding></o-button>
          <o-button attr="basic-pri" variant="basic" importance="primary" label="Primary" layout-padding></o-button>
          <o-button attr="basic-warn" variant="basic" importance="warn" label="Warn" layout-padding></o-button>
          <o-button attr="basic-dis" variant="basic" label="Disabled" [enabled]="false" layout-padding></o-button>
        </div>

        <div class="o-flex-row vi-variant-row">
          <span class="vi-variant-label">raised</span>
          <o-button attr="raised-def" variant="raised" importance="default" label="Default" layout-padding></o-button>
          <o-button attr="raised-pri" variant="raised" importance="primary" label="Primary" layout-padding></o-button>
          <o-button attr="raised-warn" variant="raised" importance="warn" label="Warn" layout-padding></o-button>
          <o-button attr="raised-dis" variant="raised" label="Disabled" [enabled]="false" layout-padding></o-button>
        </div>

        <div class="o-flex-row vi-variant-row">
          <span class="vi-variant-label">outline</span>
          <o-button attr="outline-def" variant="outline" importance="default" label="Default" layout-padding></o-button>
          <o-button attr="outline-pri" variant="outline" importance="primary" label="Primary" layout-padding></o-button>
          <o-button attr="outline-warn" variant="outline" importance="warn" label="Warn" layout-padding></o-button>
          <o-button attr="outline-dis" variant="outline" label="Disabled" [enabled]="false" layout-padding></o-button>
        </div>

        <div class="o-flex-row vi-variant-row">
          <span class="vi-variant-label">flat</span>
          <o-button attr="flat-def" variant="flat" importance="default" label="Default" layout-padding></o-button>
          <o-button attr="flat-pri" variant="flat" importance="primary" label="Primary" layout-padding></o-button>
          <o-button attr="flat-warn" variant="flat" importance="warn" label="Warn" layout-padding></o-button>
          <o-button attr="flat-dis" variant="flat" label="Disabled" [enabled]="false" layout-padding></o-button>
        </div>

        <!-- icon-only shapes: only 'icon' tints with importance; fab / mini-fab keep Material's color -->
        <div class="o-flex-row vi-variant-row">
          <span class="vi-variant-label">icon</span>
          <o-button attr="icon-def" variant="icon" icon="favorite" layout-padding></o-button>
          <o-button attr="icon-pri" variant="icon" importance="primary" icon="favorite" layout-padding></o-button>
          <o-button attr="icon-warn" variant="icon" importance="warn" icon="favorite" layout-padding></o-button>
          <o-button attr="icon-dis" variant="icon" icon="favorite" [enabled]="false" layout-padding></o-button>
        </div>

        <div class="o-flex-row vi-variant-row">
          <span class="vi-variant-label">fab</span>
          <o-button attr="fab-def" variant="fab" icon="add" layout-padding></o-button>
          <o-button attr="fab-pri" variant="fab" importance="primary" icon="add" layout-padding></o-button>
          <o-button attr="fab-warn" variant="fab" importance="warn" icon="add" layout-padding></o-button>
          <o-button attr="fab-dis" variant="fab" icon="add" [enabled]="false" layout-padding></o-button>
        </div>

        <div class="o-flex-row vi-variant-row">
          <span class="vi-variant-label">mini-fab</span>
          <o-button attr="minifab-def" variant="mini-fab" icon="edit" layout-padding></o-button>
          <o-button attr="minifab-pri" variant="mini-fab" importance="primary" icon="edit" layout-padding></o-button>
          <o-button attr="minifab-warn" variant="mini-fab" importance="warn" icon="edit" layout-padding></o-button>
          <o-button attr="minifab-dis" variant="mini-fab" icon="edit" [enabled]="false" layout-padding></o-button>
        </div>

      </div>
    </example-comp>

    <example-comp comp-name="ICON_POSITION" [files]="getFiles('button-icon-position')">
      <div class="o-flex-row-wrap">
        <o-button attr="iconposition1" type="BASIC" color="primary" label="icon-position='left'" layout-padding icon="arrow_forward_ios">
        </o-button>
        <o-button attr="iconposition2" type="RAISED" color="primary" label="icon-position='right'" layout-padding icon="arrow_forward_ios"
          icon-position="right"></o-button>
        <o-button attr="iconposition3" type="STROKED" color="primary" label="icon-position='top'" layout-padding icon="arrow_forward_ios"
          icon-position="top"></o-button>
        <o-button attr="iconposition4" type="FLAT" color="primary" label="icon-position='bottom'" layout-padding icon="arrow_forward_ios"
          icon-position="bottom">
        </o-button>
      </div>
    </example-comp>


    <example-comp comp-name="IMAGE_ICON" [files]="getFiles('button-image-icon')">
      <o-button label="Image icon" layout-padding image="./assets/images/visa.png"></o-button>
    </example-comp>

    <example-comp comp-name="BUTTON_TOGGLE" [files]="getFiles('button-toggle')">
      <div class="o-flex-column" style="justify-content: space-around; align-items: flex-start" layout-padding>
        <o-button-toggle attr="singleToggle" label="Toggle me!" layout-padding></o-button-toggle>

        <o-button-toggle-group attr="toggleGroup" layout="row" multiple="no" value="car" layout-padding>
          <o-button-toggle attr="toggle1" value="bike" icon="directions_bike"></o-button-toggle>
          <o-button-toggle attr="toggle2" value="car" icon="directions_car"></o-button-toggle>
          <o-button-toggle attr="toggle3" value="train" icon="directions_railway"></o-button-toggle>
          <o-button-toggle attr="toggle4" value="boat" icon="directions_boat" enabled="no"></o-button-toggle>
        </o-button-toggle-group>

      </div>

    </example-comp>

  </div>
</div>
